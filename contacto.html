<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Buenos Aires</title>
</head>
<body>

    <header>
        <h1>Buenos Aires</h1>
        <p>Una ciudad para descubrir</p>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="lugares.html">Lugares de interés</a>
            <a href="cultura.html">Cultura y eventos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h2>Contacto</h2>

        <p>
            Si querés conocer más sobre Buenos Aires,
            podés comunicarte con nosotros.
        </p>

        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">

            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="mensaje">Mensaje:</label>
            <br>
            <textarea id="mensaje" name="mensaje" rows="5" cols="30"></textarea>

            <br><br>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>Buenos Aires - Una ciudad para descubrir</p>
    </footer>

</body>
</html>
